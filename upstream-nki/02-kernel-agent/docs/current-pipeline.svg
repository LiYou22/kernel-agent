<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1440" height="1110" fill="#f8fafc"/>
<text x="45" y="48" font-family="Arial,sans-serif" font-size="30" fill="#0f172a" font-weight="bold">Kernel agent: current implementation pipeline</text>
<text x="45" y="78" font-family="Arial,sans-serif" font-size="17" fill="#334155" font-weight="normal">Source: agent.py + nkibench.py + verifier.py | Control flow, not a measured timing chart</text>
<rect x="45" y="110" width="890" height="880" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="63" y="140" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">CPU controller / verification</text>
<rect x="975" y="110" width="420" height="380" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
<text x="993" y="140" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">Model endpoint / accelerator</text>
<rect x="85" y="165" width="390" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="103" y="195" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">1. Configure run / select level</text>
<text x="103" y="222" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">main(): repeats and levels run sequentially</text>
<text x="103" y="245" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">solve(): start a bounded repair loop</text>
<rect x="515" y="165" width="380" height="100" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="533" y="195" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">Persistent memory bank</text>
<text x="533" y="222" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Read learned patterns before first prompt</text>
<text x="533" y="245" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Write progress, failures, best result</text>
<polyline points="515,215 475,215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="300" width="390" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="103" y="330" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">2. Build prompt</text>
<text x="103" y="357" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Reference + API card + NKI notes + memory</text>
<text x="103" y="380" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Repairs: latest code + directive + history</text>
<polyline points="280,265 280,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="435" width="390" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="103" y="465" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">3. Submit N concurrent requests</text>
<text x="103" y="492" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">ask_parallel(): ThreadPoolExecutor</text>
<text x="103" y="515" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Same prompt; default N = 2 samples</text>
<text x="103" y="538" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">ask(): budget cap; thinking off by default</text>
<polyline points="280,400 280,435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1010" y="175" width="350" height="125" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1028" y="205" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">vLLM / Qwen3-8B</text>
<text x="1028" y="232" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">HTTP /v1/chat/completions</text>
<text x="1028" y="255" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Queue / prefill / autoregressive decode</text>
<text x="1028" y="278" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Observed server: TP=2; max 4 requests</text>
<text x="1028" y="301" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Async scheduling enabled</text>
<polyline points="475,465 955,465 955,240 1010,240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="705" y="450" font-family="Arial,sans-serif" font-size="15" fill="#334155" font-weight="normal">HTTP requests</text>
<rect x="1010" y="330" width="350" height="115" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="1028" y="360" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">Observed generation throughput</text>
<text x="1028" y="387" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">22.8 tokens/s across 4 active requests</text>
<text x="1028" y="410" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">About 5.7 tokens/s per answer if equal</text>
<text x="1028" y="433" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Some log intervals also show 4 waiting</text>
<rect x="85" y="580" width="390" height="100" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="103" y="610" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">4. Wait for ALL replies</text>
<text x="103" y="637" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">No grading overlaps generation</text>
<text x="103" y="660" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Round waits for the slowest sample</text>
<polyline points="1185,300 1185,315 955,315 955,630 475,630" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1000" y="540" font-family="Arial,sans-serif" font-size="15" fill="#334155" font-weight="normal">Full responses</text>
<polyline points="280,545 280,580" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="715" width="390" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="103" y="745" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">5. Reply gate + code extraction</text>
<text x="103" y="772" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Reject truncated, empty or code-less replies</text>
<text x="103" y="795" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Usable replies go to grade(), one at a time</text>
<text x="103" y="818" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Every attempt is appended to JSONL</text>
<polyline points="280,680 280,715" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="515" y="580" width="380" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="533" y="610" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">6. grade(): ordered checks</text>
<text x="533" y="637" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Parse → rules → import candidate</text>
<text x="533" y="660" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">CPU simulate each case + NumPy reference</text>
<text x="533" y="683" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Check inputs, values, hazards and traffic</text>
<text x="533" y="706" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Verdict: reward + one repair directive</text>
<text x="533" y="729" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Weights: parse .1 / rules .2 / run .2 / correct .5</text>
<polyline points="475,770 495,770 495,660 515,660" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495" y="755" font-family="Arial,sans-serif" font-size="15" fill="#334155" font-weight="normal">Usable</text>
<rect x="515" y="780" width="380" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="533" y="810" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">7. Rank candidates / track progress</text>
<text x="533" y="837" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Select highest reward in this round</text>
<text x="533" y="860" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Update latest code, history and memory</text>
<text x="533" y="883" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Track failure classes and stop conditions</text>
<polyline points="705,745 705,780" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="895,835 920,835 920,215 895,215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="975" y="580" width="420" height="155" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="993" y="610" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">8. If development checks pass</text>
<text x="993" y="637" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Run grade(code, holdout=True)</text>
<text x="993" y="660" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Holdout feedback is NOT sent to the model</text>
<text x="993" y="683" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Pass: verified; fail: dev-only</text>
<text x="993" y="706" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Both outcomes end the level</text>
<polyline points="895,815 945,815 945,660 975,660" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="904" y="800" font-family="Arial,sans-serif" font-size="15" fill="#334155" font-weight="normal">Dev pass</text>
<rect x="975" y="780" width="420" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="993" y="810" font-family="Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="bold">Finish / move to next level</text>
<text x="993" y="837" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Otherwise stop as stuck or failed</text>
<text x="993" y="860" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Append result record; report run summary</text>
<text x="993" y="883" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">--repeat aggregates outcomes across runs</text>
<polyline points="1185,735 1185,780" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="895,870 975,870" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="899" y="857" font-family="Arial,sans-serif" font-size="15" fill="#334155" font-weight="normal">Stop limit</text>
<polyline points="705,890 705,940 65,940 65,350 85,350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="190" y="930" font-family="Arial,sans-serif" font-size="15" fill="#334155" font-weight="normal">Failure with rounds remaining: repair and repeat</text>
<polyline points="85,770 55,770 55,350 85,350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="85" y="872" font-family="Arial,sans-serif" font-size="15" fill="#334155" font-weight="normal">No usable replies: shorten prompt and retry</text>
<text x="85" y="967" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Offline mode substitutes reference replies and skips persistent memory.</text>
<text x="45" y="1030" font-family="Arial,sans-serif" font-size="21" fill="#0f172a" font-weight="bold">Where time goes</text>
<text x="45" y="1060" font-family="Arial,sans-serif" font-size="18" fill="#334155" font-weight="normal">Endpoint queue + generation → slowest-reply barrier → serial candidate grading → optional holdout grading</text>
<text x="45" y="1090" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">The 22.8 tokens/s log measures server generation; it does not include the entire agent round.</text>
</svg>